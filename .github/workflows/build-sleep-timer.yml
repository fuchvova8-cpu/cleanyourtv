
name: Build Sleep Timer APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Sleep Timer
        run: bash tools/docker-build.sh addons/sleep-timer

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sleep-timer-apk
          path: addons/sleep-timer/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
